name: Dual Build Official / Zstd
on:
  workflow_dispatch:
    inputs:
      BuildMode:
        description: 构建模式 official / zstd
        required: true
        default: official
        type: choice
        options:
          - official
          - zstd

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 新增：预先安装MSVC编译环境，解决vswhere缺失
      - name: Install MSVC Build Tools
        uses: ilammy/setup-msvc-dev@v1
        with:
          arch: x64
          target: x64

      # 缓存官方7zS.sfx安装模块
      - name: Cache 官方7zS.sfx安装模块
        id: cache_sfx
        uses: actions/cache@v4
        with:
          path: _CacheSFX
          key: sfx-mainline-static-v1
      - name: 缓存缺失 → 编译官方7zS.sfx
        if: steps.cache_sfx.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 拉取官方原版源码
          git clone https://github.com/ip7z/7zip _tmp_mainline_sfx
          Set-Location _tmp_mainline_sfx/CPP/7zip
          # 直接使用全局已加载MSVC环境，不再手动查找vs
          Set-Location Bundles/SFXSetup
          nmake PLATFORM=x64
          # 输出至缓存目录
          New-Item -Path ../../../../_CacheSFX -ItemType Directory -Force | Out-Null
          Copy-Item x64/7zS.sfx ../../../../_CacheSFX/7zS.sfx -Force
          Set-Location $PSScriptRoot
          Remove-Item _tmp_mainline_sfx -Recurse -Force

      - name: 获取对应仓库最新Release
        shell: pwsh
        run: |
          $mode = "${{ github.event.inputs.BuildMode }}"
          if ($mode -eq "official") {
            $api = "https://api.github.com/repos/ip7z/7zip/releases/latest"
            $release = Invoke-RestMethod -Uri $api
            $fullTag = $release.tag_name
            $verNum = $fullTag -replace '\.', ''
            $prefix = "7z$verNum"
            $releaseTitle = "7-Zip $verNum Custom Icon"
            $exeName = "$prefix-Custom-Icon.exe"
            $releaseTag = $fullTag
          } else {
            $api = "https://api.github.com/repos/mcmilk/7-Zip-zstd/releases/latest"
            $release = Invoke-RestMethod -Uri $api
            $fullTag = $release.tag_name
            $verBase = $fullTag -split "-v" | Select-Object -First 1
            $verNum = $verBase.TrimStart('v') -replace '\.', ''
            $prefix = "7z$verNum"
            $releaseTitle = "7-Zip ZS $verNum Custom Icon"
            $exeName = "$prefix-ZS-Custom-Icon.exe"
            $releaseTag = "zs-$verNum"
          }
          echo "MODE=$mode" >> $env:GITHUB_ENV
          echo "FULL_TAG=$fullTag" >> $env:GITHUB_ENV
          echo "PREFIX=$prefix" >> $env:GITHUB_ENV
          echo "VER_NUM=$verNum" >> $env:GITHUB_ENV
          echo "RELEASE_TITLE=$releaseTitle" >> $env:GITHUB_ENV
          echo "EXE_NAME=$exeName" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          Set-Content 7zVer.txt $prefix

      - name: 源码准备（双脚本自动切换）
        shell: pwsh
        run: |
          $pfx = Get-Content 7zVer.txt
          if ($env:MODE -eq "official") {
            .\Prepare.ps1 -BuildVersion $pfx
          } else {
            .\PrepareZstd.ps1 -RawTag $env:FULL_TAG
          }

      # 编译前同样加载MSVC环境
      - name: 编译 Build（共用脚本）
        uses: ilammy/setup-msvc-dev@v1
        with:
          arch: x64
          target: x64
        run: |
          $pfx = Get-Content 7zVer.txt
          .\Build.ps1 -BuildVersion $pfx

      - name: 打包 Pack（共用缓存7zS.sfx，支持安装向导）
        shell: pwsh
        run: |
          $ver = Get-Content 7zVer.txt
          .\Pack.ps1 -BuildVersion $ver
          Rename-Item "$ver.exe" "$env:EXE_NAME" -Force

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: ./*.exe
          compression-level: 0

      - name: 发布Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.EXE_NAME }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
